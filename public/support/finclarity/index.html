<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Support — FinClarity</title>
  <meta name="description" content="FinClarity Support (minimal placeholder) — FAQ, troubleshooting, contact, and privacy policy link."/>
  <meta property="og:title" content="Support — FinClarity" />
  <meta property="og:description" content="Minimal support page placeholder for FinClarity (update before publishing)." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/img/og.png" />
  <link rel="canonical" href="/support/finclarity/" />

  <link rel="stylesheet" href="/assets/css/styles.css" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
          return;
        }
        var hasMatch = typeof window.matchMedia === "function";
        if (hasMatch && window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <style>
    .page-wrap { max-width: 980px; }
    .page-title { margin: 0 0 8px; font-weight: 900; }
    .section-title { margin: 18px 0 10px; }
    .faq details { border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 14px; background: rgba(255,255,255,0.03); }
    .faq summary { cursor: pointer; font-weight: 800; }
    .faq details + details { margin-top: 10px; }
    .card-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top: 16px; }
  </style>
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Saltar al contenido</a>

  <header class="nav">
    <div class="container nav__inner">
      <a class="brand" href="/" aria-label="Ir al inicio">
        <span class="brand__dot"></span>
        <span class="brand__text">Agner<span class="brand__accent">Diaz</span></span>
      </a>

      <button class="nav__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav__menu" id="navMenu" aria-label="Navegación Support">
        <a href="/" data-i18n="nav.home">Inicio</a>
        <a href="/projects/" data-i18n="nav.projects">Proyectos</a>

        <button class="icon-btn" id="langToggle" type="button" aria-label="Cambiar idioma">ES</button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Cambiar tema">☾</button>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container page-wrap">
        <div class="card">
          <h1 class="page-title" data-i18n="support.finclarity.title">Support — FinClarity</h1>
          <p class="muted" data-i18n="support.finclarity.subtitle"></p>

          <h3 class="section-title" data-i18n="support.finclarity.faqTitle">FAQ</h3>
          <div class="faq">
            <details>
              <summary data-i18n="support.finclarity.faq.q1">Question 1</summary>
              <p class="card__text" data-i18n="support.finclarity.faq.a1"></p>
            </details>
            <details>
              <summary data-i18n="support.finclarity.faq.q2">Question 2</summary>
              <p class="card__text" data-i18n="support.finclarity.faq.a2"></p>
            </details>
            <details>
              <summary data-i18n="support.finclarity.faq.q3">Question 3</summary>
              <p class="card__text" data-i18n="support.finclarity.faq.a3"></p>
            </details>
          </div>

          <h3 class="section-title" data-i18n="support.finclarity.troubleshootingTitle">Troubleshooting</h3>
          <ul class="muted" style="margin:0; padding-left: 18px;">
            <li data-i18n="support.finclarity.troubleshooting.t1"></li>
            <li data-i18n="support.finclarity.troubleshooting.t2"></li>
            <li data-i18n="support.finclarity.troubleshooting.t3"></li>
          </ul>

          <h3 class="section-title" data-i18n="support.finclarity.contactTitle">Contact</h3>
          <p class="card__text">
            <strong data-i18n="support.finclarity.emailLabel">Support email</strong>:
            <a href="mailto:finclarity.support@gmail.com"><span data-i18n="privacy.finclarity.contactEmail">finclarity.support@gmail.com</span></a>

          <div class="card-actions">
            <a class="btn btn--primary" href="/privacy/finclarity/" data-i18n="support.finclarity.privacyLink">Read the Privacy Policy</a>
            <a class="btn btn--soft" href="/projects/" data-i18n="common.backProjects">Back to projects</a>
            <a class="btn btn--soft" href="/" data-i18n="common.backHome">Back home</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="muted">
        © <span id="year"></span>
        <span data-i18n="footer.rest">Agner Diaz • Desarrollado con HTML/CSS/JS</span>
      </p>
    </div>
  </footer>

  <script src="/assets/i18n/i18n.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
