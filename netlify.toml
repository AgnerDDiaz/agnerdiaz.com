# Netlify — agnerdiaz.com

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# ── Redirects 301 de las URLs antiguas al sitio nuevo ─────────────────────
# IMPORTANTE: /privacy/finclarity/ y /support/finclarity/ NO se redirigen:
# están publicadas en las tiendas y ahora sirven contenido directo (200).
# La raíz «/» tampoco: la resuelve src/pages/index.astro según el idioma.

[[redirects]]
  from = "/projects/finclarity/*"
  to = "/es/proyectos/finclarity/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/es/proyectos/"
  status = 301

[[redirects]]
  from = "/links/*"
  to = "/es/links/"
  status = 301

# ── Cabeceras ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los assets con nombre estable se revalidan; los que Astro versiona con hash
# se cachean de forma agresiva.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
