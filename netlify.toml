# Netlify — agnerdiaz.com
#
# Fase 0: se activa el build de Astro. Las rutas públicas NO cambian todavía
# (todo el sitio actual vive en `public/` y se copia tal cual a `dist/`), así
# que aún no hacen falta redirects. Los 301 se añaden en la Fase 1, cuando las
# rutas pasen a `/es/…` y `/en/…`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# ── Cabeceras ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los assets con nombre estable se revalidan; los que Astro versiona con hash
# se cachean de forma agresiva.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
